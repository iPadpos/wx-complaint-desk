{% extends 'base.html' %}{% block layout %}<main class="login-page"><section class="login-card"><span class="brand-icon"><svg><use href="#i-chat"/></svg></span><h2>登录客诉工作台</h2><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="field"><label for="id_username">账号</label>{{ form.username }}{{ form.username.errors }}</div><div class="field"><label for="id_password">密码</label>{{ form.password }}{{ form.password.errors }}</div>{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="primary wide">登录</button></form></section></main>{% endblock %}
